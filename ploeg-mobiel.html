<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>PloegCompleet – Brandweer Gelderland Midden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg:#12161B;
    --surface:#1B2129;
    --surface-2:#232B34;
    --border:#2E3843;
    --text:#EDEFF1;
    --text-muted:#8A96A3;
    --red:#E33629;
    --red-dim:#3A1613;
    --lime:#D7E100;
    --amber:#F0A93A;
    --blue-grey:#5B7083;
    --grey-nee:#55606B;
    --radius:8px;
    --font-display:'Barlow Condensed',Arial,sans-serif;
    --font-body:'Open Sans',Arial,sans-serif;
    --font-mono:'Open Sans',Arial,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);font-family:var(--font-body);}
  body{-webkit-font-smoothing:antialiased;}
  #app{max-width:720px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;padding-bottom:40px;}
  @media(min-width:900px){ #app{max-width:960px;} }
  button,input,select,textarea{font-family:inherit;color:inherit;}
  a{color:var(--lime);}
  ::selection{background:var(--lime);color:#12161B;}

  .header{position:sticky;top:0;z-index:10;background:var(--bg);padding:14px 16px 0;}
  .header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;}
  .brand{font-family:var(--font-display);font-weight:700;letter-spacing:0.05em;font-size:21px;text-transform:uppercase;line-height:1;}
  .brand small{display:block;font-family:var(--font-mono);font-size:11px;letter-spacing:0.08em;color:var(--text-muted);text-transform:uppercase;margin-top:4px;font-weight:600;}
  .header-actions{display:flex;align-items:center;gap:6px;position:relative;}
  .chevron-divider{height:5px;margin-top:12px;background:repeating-linear-gradient(45deg,var(--red) 0 9px,var(--lime) 9px 18px);}
  .icon-btn{background:var(--surface);border:1px solid var(--border);border-radius:6px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:15px;position:relative;}
  .icon-btn:hover{border-color:var(--lime);}
  .badge-dot{position:absolute;top:-4px;right:-4px;background:var(--red);color:#fff;font-family:var(--font-mono);font-size:10px;border-radius:10px;min-width:16px;height:16px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
  .user-chip{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .user-chip:hover{border-color:var(--lime);}
  .user-chip .role{color:var(--text-muted);}

  .tabs{display:flex;gap:4px;overflow-x:auto;padding:12px 16px;border-bottom:1px solid var(--border);}
  .tab{font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.04em;font-size:14px;padding:8px 14px;border-radius:999px;background:transparent;color:var(--text-muted);border:1px solid transparent;cursor:pointer;white-space:nowrap;}
  .tab.active{background:var(--surface-2);color:var(--text);border-color:var(--border);}
  .tab:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.member-pick:focus-visible{outline:2px solid var(--lime);outline-offset:2px;}

  .content{padding:16px;flex:1;}
  .eyebrow{font-family:var(--font-mono);font-weight:600;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);margin:22px 0 8px;display:flex;align-items:center;gap:8px;}
  .eyebrow:first-child{margin-top:0;}
  .info-line{font-size:13px;color:var(--text-muted);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 12px;margin-bottom:6px;}
  .error-line{font-size:13px;background:var(--surface);border:1px solid var(--red);color:#FF8A80;border-radius:var(--radius);padding:10px 12px;margin:12px 16px 0;}

  .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
  .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;flex-wrap:wrap;}
  .tag-row{display:flex;gap:6px;flex-wrap:wrap;}
  .post-tag{font-family:var(--font-display);text-transform:uppercase;font-size:13px;letter-spacing:0.03em;padding:3px 9px;border-radius:4px;border:1px solid var(--border);}
  .post-noord{background:rgba(91,112,131,0.15);border-color:var(--blue-grey);color:#AEC3D6;}
  .post-zuid{background:rgba(240,169,58,0.12);border-color:var(--amber);color:var(--amber);}
  .post-ede{background:rgba(215,225,0,0.12);border-color:var(--lime);color:var(--lime);}
  .doelgroep-tag{font-family:var(--font-mono);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:0.04em;padding:3px 8px;border-radius:4px;border:1px dashed var(--text-muted);color:var(--text-muted);}
  .date-big{font-family:var(--font-mono);font-weight:700;font-size:15px;color:var(--text);font-variant-numeric:tabular-nums;}
  .urgent-badge{background:var(--red-dim);color:#FF8A80;border:1px solid var(--red);font-family:var(--font-mono);font-weight:700;font-size:12px;padding:2px 7px;border-radius:4px;text-transform:uppercase;}
  .notitie{font-size:13px;color:var(--text-muted);margin-top:6px;font-style:italic;}

  .deadline-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12px;color:var(--text-muted);}
  .deadline-track{position:relative;height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden;border:1px solid var(--border);margin-top:6px;}
  .deadline-elapsed{position:absolute;left:0;top:0;height:100%;background:var(--border);}
  .deadline-remaining{position:absolute;right:0;top:0;height:100%;background:repeating-linear-gradient(45deg,var(--red) 0 6px,var(--lime) 6px 12px);}

  .slot{margin-top:12px;padding-top:12px;border-top:1px dashed var(--border);}
  .slot:first-child{border-top:none;margin-top:8px;padding-top:0;}
  .slot-label{font-family:var(--font-display);text-transform:uppercase;font-size:14px;letter-spacing:0.02em;margin-bottom:6px;}
  .response-buttons{display:flex;gap:6px;flex-wrap:wrap;}
  .resp-btn{flex:1;min-width:100px;padding:9px 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);font-size:13px;cursor:pointer;text-align:center;}
  .resp-btn:hover{border-color:var(--lime);}
  .resp-btn.ja.selected{background:var(--lime);color:#12161B;border-color:var(--lime);font-weight:600;}
  .resp-btn.kan_wel.selected{background:var(--amber);color:#12161B;border-color:var(--amber);font-weight:600;}
  .resp-btn.nee.selected{background:var(--grey-nee);color:var(--text);border-color:var(--grey-nee);}
  .counts-line{font-size:13px;font-weight:400;color:var(--text-muted);margin-top:6px;font-family:var(--font-mono);}

  .assigned-banner{padding:9px 10px;border-radius:6px;background:rgba(215,225,0,0.08);border:1px solid var(--lime);font-size:13px;}
  .assigned-banner.mine{background:rgba(215,225,0,0.18);}

  .expand-btn{background:none;border:none;color:var(--lime);font-size:12px;font-weight:600;cursor:pointer;padding:0;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.05em;}
  .card-tools{display:flex;gap:14px;align-items:center;margin-top:10px;flex-wrap:wrap;}
  .wa-link{font-size:12px;font-weight:600;color:#25D366;text-decoration:none;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:0.05em;}
  .wa-link:hover{text-decoration:underline;}
  .admin-panel{margin-top:10px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:10px;}
  .admin-panel h4{margin:0 0 8px;font-family:var(--font-display);text-transform:uppercase;font-size:13px;letter-spacing:0.03em;color:var(--text-muted);}
  .reactie-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--border);font-size:13px;flex-wrap:wrap;}
  .reactie-row:last-child{border-bottom:none;}
  .reactie-meta{color:var(--text-muted);font-family:var(--font-mono);font-size:12px;}
  .suggest-star{color:var(--lime);margin-right:4px;}
  .small-btn{background:var(--surface);border:1px solid var(--border);border-radius:5px;padding:5px 9px;font-size:12px;cursor:pointer;display:inline-block;}
  .small-btn:hover{border-color:var(--lime);}
  .small-btn.primary{background:var(--red);border-color:var(--red);color:#fff;}

  .field{margin-bottom:12px;display:flex;flex-direction:column;gap:4px;}
  .field-row{display:flex;gap:10px;flex-wrap:wrap;}
  .field-row .field{flex:1;min-width:150px;}
  .field-checkbox{display:flex;flex-direction:row;align-items:center;gap:8px;margin-bottom:14px;background:var(--red-dim);border:1px solid var(--red);border-radius:6px;padding:10px 12px;}
  .field-checkbox input{width:auto;}
  .field-checkbox label{text-transform:none;font-size:13px;color:var(--text);font-family:var(--font-body);}
  .doelgroep-box{border:1px solid var(--border);border-radius:6px;padding:10px 12px;margin-bottom:14px;background:var(--surface-2);}
  .doelgroep-box .eyebrow{margin:0 0 8px;}
  label{font-size:11.5px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;font-family:var(--font-mono);}
  input,select,textarea{background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:9px 10px;border-radius:6px;font-size:14px;width:100%;}
  textarea{resize:vertical;min-height:50px;}
  .preview-line{font-size:12px;color:var(--lime);font-family:var(--font-mono);}

  .btn{font-family:var(--font-display);text-transform:uppercase;letter-spacing:0.03em;padding:10px 16px;border-radius:6px;border:1px solid var(--border);background:var(--surface-2);color:var(--text);cursor:pointer;font-size:14px;}
  .btn:hover{border-color:var(--lime);}
  .btn-primary{background:var(--red);border-color:var(--red);color:#fff;}
  .btn-primary:hover{background:#c72e22;border-color:#c72e22;}
  .btn-ghost{background:transparent;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;}

  .list-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px;}
  .list-item-top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
  .status-tag{font-family:var(--font-mono);font-weight:600;font-size:12px;padding:2px 7px;border-radius:4px;text-transform:uppercase;border:1px solid var(--border);color:var(--text-muted);}
  .status-open{color:var(--amber);border-color:var(--amber);}
  .status-full{color:var(--lime);border-color:var(--lime);}
  .status-overdue{color:#FF8A80;border-color:var(--red);}
  .role-badge{font-family:var(--font-mono);font-weight:600;font-size:11px;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--surface-2);color:var(--text-muted);border:1px solid var(--border);}
  .role-badge.admin{color:var(--lime);border-color:var(--lime);}
  .role-badge.extra{color:var(--amber);border-color:var(--amber);}
  .pin-input{width:70px;display:inline-block;text-align:center;letter-spacing:0.15em;}
  .phone-input{width:130px;display:inline-block;}
  .mini-select{width:auto;display:inline-block;}
  .inline-field-label{font-size:10.5px;font-weight:600;color:var(--text-muted);font-family:var(--font-mono);text-transform:uppercase;display:block;margin-bottom:2px;}
  .meta-line{font-size:12px;color:var(--text-muted);font-family:var(--font-mono);margin-top:4px;}

  .login-wrap{padding:50px 20px;max-width:420px;margin:0 auto;text-align:center;}
  .login-wrap .brand{display:flex;flex-direction:column;align-items:center;}
  .member-pick-list{display:flex;flex-direction:column;gap:8px;margin-top:18px;text-align:left;}
  .member-pick{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--border);border-radius:8px;cursor:pointer;}
  .member-pick:hover{border-color:var(--lime);}

  .empty{padding:26px 10px;text-align:center;color:var(--text-muted);font-size:14px;}
  .toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--surface-2);border:1px solid var(--lime);color:var(--text);padding:10px 16px;border-radius:6px;font-size:13px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,0.4);max-width:88vw;}
  .melding-dropdown{position:absolute;top:44px;right:16px;width:300px;max-width:80vw;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,0.5);max-height:320px;overflow-y:auto;}
  .melding-item{font-size:12px;padding:8px;border-bottom:1px solid var(--border);}
  .melding-item:last-child{border-bottom:none;}
  .melding-time{color:var(--text-muted);font-family:var(--font-mono);font-size:10px;margin-top:2px;}

  .stat-big{font-family:var(--font-mono);font-weight:700;font-size:34px;color:var(--lime);font-variant-numeric:tabular-nums;}
  .stat-label{font-size:12px;color:var(--text-muted);}

  details.filled-section summary{cursor:pointer;font-family:var(--font-mono);font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-muted);margin:24px 0 8px;}

  @media(prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important;} }
</style>
</head>
<body>
<div id="app"></div>
<script>
(function(){
  "use strict";

  // ---------- Supabase ----------
  var PLOEG_URL = "https://gqqflxctuikbygqnbrli.supabase.co";
  var PLOEG_KEY = "sb_publishable_8MFTS2ygpMxPwsl1-EH1aQ_GvmxQAtC";
  var DAG_URL = "https://iyquepqubfqrhybriqif.supabase.co";
  var DAG_KEY = "sb_publishable_Pb0fFfxZQggKnFCtJYMH9A_avw0GaPn";
  var sbPloeg = window.supabase.createClient(PLOEG_URL, PLOEG_KEY);
  var sbDag = window.supabase.createClient(DAG_URL, DAG_KEY);

  // Pushmeldingen -- hergebruikt dezelfde push_subscriptions-tabel en dezelfde
  // Edge Functions als de mobiele Ploeg-app. Vraagt na het inloggen om
  // toestemming; werkt op desktop ook gewoon vanuit een los tabblad (geen
  // "installatie" nodig, dat is alleen een iPhone-beperking).
  var VAPID_PUBLIC_KEY = "BLMZJzCHcbn1zYjZtfBSk7zNk138i_GOeGSj00czjBJ6YPT_qtKLywleKHKXuomKkfln6_2dRWY3m4GtKvl_s-0";
  var pushGevraagd = false;
  function urlBase64ToUint8Array(base64String){
    var padding = "=".repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, "+").replace(/_/g, "/");
    var raw = atob(base64), out = new Uint8Array(raw.length);
    for(var i=0;i<raw.length;++i) out[i] = raw.charCodeAt(i);
    return out;
  }
  async function vraagPushToestemming(){
    if(pushGevraagd) return;
    pushGevraagd = true;
    if(!("serviceWorker" in navigator)) return;
    try{
      var reg = await navigator.serviceWorker.ready;
      if(!reg.pushManager) return;
      var toestemming = await Notification.requestPermission();
      if(toestemming !== "granted") return;
      var sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY) });
      await sbPloeg.from("push_subscriptions").upsert({ lid_id: state.currentUserId, subscriptie: sub.toJSON(), bijgewerkt_op: new Date().toISOString() }, {onConflict:"lid_id"});
    }catch(e){ console.warn("Pushmeldingen instellen mislukt:", e); }
  }

  var LAST_USER_KEY = "ploegcompleet-last-user-v2";
  var ANTWOORD_LABEL = {ja:"Ja, ik kan", kan_wel:"Kan wel, liever niet", nee:"Nee, ik kan niet"};
  var ROLE_INFO = {
    personeel: {label:"Personeel", omschrijving:"Kan reageren op open diensten (ja / kan wel, liever niet / nee) en de eigen dienst-historie bekijken."},
    bevelvoerder: {label:"Bevelvoerder", omschrijving:"Kan daarnaast open diensten aanmaken, bewerken, verwijderen en toewijzen."},
    pco: {label:"PCO", omschrijving:"Kan net als een bevelvoerder open diensten aanmaken, bewerken, verwijderen en toewijzen."},
    roosterplanning: {label:"Planning", omschrijving:"Kan alles wat een bevelvoerder kan, plus extra accounts toevoegen en beheren."},
    beheer: {label:"Beheer", omschrijving:"Volledige toegang tot alles, inclusief dit instellingenoverzicht."}
  };
  var ROLE_ORDER = ["personeel","bevelvoerder","pco","roosterplanning","beheer"];
  var DIENSTVERBAND_LABEL = {beroeps:"Beroeps", vrijwillig:"Vrijwilliger", onbekend:"Onbekend"};
  var POST_NAMEN = {post1:"Arnhem Noord", post2:"Arnhem Zuid", post3:"Ede Stad"};
  var POST_ORDER = ["post1","post2","post3"];

  var state = {
    data: null,
    loadError: null,
    currentUserId: null,
    pendingUserId: null,
    loginError: null,
    view: "diensten",
    loading: true,
    toast: null,
    bellOpen: false,
    confirmDeleteShiftId: null,
    confirmDeleteMemberId: null,
    editingShiftId: null,
    showForm: false,
    expandedShiftId: null,
    beheerAlleenOpen: false
  };
  var toastTimer = null;

  // ---------- helpers ----------
  function uid(p){ return p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function pad(n){ return String(n).padStart(2,"0"); }
  function toLocalDateStr(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function toLocalDateTimeStr(d){ return toLocalDateStr(d) + "T" + pad(d.getHours()) + ":" + pad(d.getMinutes()); }
  function parseDateOnly(str){ var parts = str.split("-").map(Number); return new Date(parts[0], parts[1]-1, parts[2]); }
  function escapeHtml(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }

  function roleLabel(rol){ return (ROLE_INFO[rol] && ROLE_INFO[rol].label) || rol; }
  function dienstverbandLabel(d){ return DIENSTVERBAND_LABEL[d] || d || "Onbekend"; }
  function postNaam(id){ return POST_NAMEN[id] || id; }
  function postClass(id){ if(id==="post1") return "post-noord"; if(id==="post2") return "post-zuid"; return "post-ede"; }
  function kanDienstenBeheren(rol){ return rol==="bevelvoerder" || rol==="pco" || rol==="roosterplanning" || rol==="beheer"; }
  function kanPersoneelBeheren(rol){ return rol==="roosterplanning" || rol==="beheer"; }
  function kanInstellingenZien(rol){ return rol==="beheer"; }
  function isVerhoogdeRol(rol){ return rol!=="personeel"; }

  function getMember(id, data){ return data.members.filter(function(m){ return m.id===id; })[0] || null; }
  function getMemberName(id, data){ var m = getMember(id,data); return m ? m.naam : "(onbekend lid)"; }

  function defaultDoelgroep(){ return {specialisme:"alle", aanstelling:"iedereen"}; }
  function matchesDoelgroep(member, shift){
    if(member.isExtra) return true;
    var dg = shift.doelgroep || defaultDoelgroep();
    if(dg.specialisme && dg.specialisme!=="alle" && (member.specialismen||[]).indexOf(dg.specialisme)===-1) return false;
    if(dg.aanstelling && dg.aanstelling!=="iedereen" && member.dienstverband!==dg.aanstelling) return false;
    return true;
  }
  function doelgroepLabel(shift){
    var dg = shift.doelgroep || defaultDoelgroep();
    var parts = [];
    if(dg.specialisme && dg.specialisme!=="alle") parts.push("Alleen " + dg.specialisme);
    if(dg.aanstelling && dg.aanstelling!=="iedereen") parts.push("Alleen " + (dg.aanstelling==="beroeps"?"beroeps":"vrijwilligers"));
    return parts;
  }

  function formatDateShort(dateStr){
    var d = parseDateOnly(dateStr);
    return d.toLocaleDateString("nl-NL", {weekday:"short", day:"numeric", month:"short"});
  }
  function formatDateTime(dtStr){
    var d = new Date(dtStr);
    return d.toLocaleString("nl-NL", {weekday:"short", day:"numeric", month:"short", hour:"2-digit", minute:"2-digit"});
  }
  function urgencyOf(dateStr){
    var today = new Date(); today.setHours(0,0,0,0);
    var d = parseDateOnly(dateStr);
    var diff = Math.round((d - today) / 86400000);
    if(diff <= 0) return "vandaag";
    if(diff <= 4) return "komende4";
    return "verderop";
  }
  function remainingMs(deadline){ return new Date(deadline).getTime() - Date.now(); }
  function formatRemaining(deadline){
    var ms = remainingMs(deadline);
    if(ms <= 0) return "Gesloten";
    var days = Math.floor(ms/86400000), hours = Math.floor((ms%86400000)/3600000), mins = Math.floor((ms%3600000)/60000);
    if(days>0) return "nog " + days + "d " + hours + "u";
    if(hours>0) return "nog " + hours + "u " + mins + "m";
    return "nog " + mins + "m";
  }
  function elapsedFraction(shift){
    var start = new Date(shift.aangemaaktOp).getTime();
    var end = new Date(shift.deadline).getTime();
    var now = Date.now();
    if(end <= start) return 1;
    var f = (now-start)/(end-start);
    return Math.max(0, Math.min(1, f));
  }

  function shiftOfSlot(slotId, data){
    for(var i=0;i<data.shifts.length;i++){
      var s = data.shifts[i];
      for(var j=0;j<s.slots.length;j++){ if(s.slots[j].slotId===slotId) return s; }
    }
    return null;
  }
  function getSlotAssignment(slotId, data){ return data.toewijzingen.filter(function(t){ return t.slotId===slotId; })[0] || null; }
  function countReactions(slotId, data){
    var rs = data.reacties.filter(function(r){ return r.slotId===slotId; });
    return {
      ja: rs.filter(function(r){return r.antwoord==="ja";}).length,
      kan_wel: rs.filter(function(r){return r.antwoord==="kan_wel";}).length,
      nee: rs.filter(function(r){return r.antwoord==="nee";}).length
    };
  }
  function computeShiftCounts(lidId, data){
    var year = new Date().getFullYear();
    var lid = getMember(lidId, data);
    var correctie = lid ? (lid.correctie||0) : 0;
    return correctie + data.toewijzingen.filter(function(t){
      if(t.lidId!==lidId) return false;
      var s = shiftOfSlot(t.slotId, data);
      return s && parseDateOnly(s.datum).getFullYear()===year;
    }).length;
  }
  function autoSuggestForSlot(slotId, data){
    var reacties = data.reacties.filter(function(r){ return r.slotId===slotId; });
    var ja = reacties.filter(function(r){ return r.antwoord==="ja"; });
    var pool = ja.length ? ja : reacties.filter(function(r){ return r.antwoord==="kan_wel"; });
    return pool.map(function(r){
      return {lidId:r.lidId, naam:getMemberName(r.lidId,data), antwoord:r.antwoord, tijdstip:r.tijdstip, count:computeShiftCounts(r.lidId,data)};
    }).sort(function(a,b){ return (a.count-b.count) || (new Date(a.tijdstip)-new Date(b.tijdstip)); });
  }
  function openShifts(data){ return data.shifts.filter(function(s){ return s.slots.some(function(sl){ return !getSlotAssignment(sl.slotId,data); }); }); }
  function filledShifts(data){ return data.shifts.filter(function(s){ return s.slots.length>0 && s.slots.every(function(sl){ return getSlotAssignment(sl.slotId,data); }); }); }
  function hasOpenSlot(shift, data){ return shift.slots.some(function(sl){ return !getSlotAssignment(sl.slotId,data); }); }

  function bronKey(r){ return r.slotId + "_" + r.lidId + "_" + r.tijdstip; }

  function defaultTijden(){ return {ochtend:"08:00", avond:"18:00"}; }
  function buildSlots(type, tijden){
    tijden = tijden || defaultTijden();
    if(type==="split") return [{slotId:uid("sl"), label:"Dag ("+tijden.ochtend+"–"+tijden.avond+")"},{slotId:uid("sl"), label:"Avond/Nacht ("+tijden.avond+"–"+tijden.ochtend+")"}];
    return [{slotId:uid("sl"), label:"Hele dienst ("+tijden.ochtend+"–"+tijden.ochtend+")"}];
  }

  function renderBericht(sjabloon, vars){
    return sjabloon.replace(/\{post\}/g, vars.post).replace(/\{datum\}/g, vars.datum)
      .replace(/\{deadline\}/g, vars.deadline).replace(/\{doelgroep\}/g, vars.doelgroep);
  }

    var nummer = (data.instellingen && data.instellingen.whatsappNummer) ? data.instellingen.whatsappNummer.replace(/[^0-9]/g,"") : "";
    var dgParts = doelgroepLabel(shift);

  async function syncMeldingenRemote(data){
    var known = {}; data.meldingen.forEach(function(m){ known[m.bron]=true; });
    var toInsert = [];
    data.shifts.forEach(function(shift){
      var slotIds = shift.slots.map(function(sl){return sl.slotId;});
      data.reacties.filter(function(r){ return slotIds.indexOf(r.slotId)>-1; }).forEach(function(r){
        var key = bronKey(r);
        if(known[key]) return;
        var isPast = new Date(shift.deadline) <= new Date();
        if(shift.meldingMoment==="direct" || (shift.meldingMoment==="na_sluiting" && isPast)){
          var slot = shift.slots.filter(function(sl){return sl.slotId===r.slotId;})[0];
          var tekst = getMemberName(r.lidId,data) + ' reageerde "' + ANTWOORD_LABEL[r.antwoord] + '" op ' + postNaam(shift.post) + ' – ' + formatDateShort(shift.datum) + (slot ? " (" + slot.label + ")" : "");
          toInsert.push({id:uid("n"), tekst:tekst, tijdstip:new Date().toISOString(), gelezen:false, bron:key});
          known[key]=true;
        }
      });
    });
    if(toInsert.length){
      var res = await sbPloeg.from("meldingen").insert(toInsert);
      if(!res.error){ data.meldingen = data.meldingen.concat(toInsert); }
    }
  }

  App.saveShift = function(evt){
    evt.preventDefault();
    var f = evt.target;
    var post = f.post.value;
    var isSpoed = !!(f.spoed && f.spoed.checked);
    var datumVal, deadlineIso, meldingMoment;

    if(isSpoed){
      var now = new Date();
      datumVal = toLocalDateStr(now);
      deadlineIso = new Date(now.getTime() + 2*3600000).toISOString();
      meldingMoment = "direct";
    } else {
      datumVal = f.datum.value;
      if(!post || !datumVal || !f.deadline.value){ showToast("Vul post, datum en deadline in."); return false; }
      deadlineIso = new Date(f.deadline.value).toISOString();
      meldingMoment = f.meldingMoment.value;
    }
    var notitie = f.notitie.value.trim();
    if(isSpoed) notitie = notitie ? ("Spoed – " + notitie) : "Spoedmelding";
    var doelgroep = { specialisme: f.doelSpecialisme.value, aanstelling: f.doelAanstelling.value };

    if(state.editingShiftId === "new"){
      var type = f.type.value;
      var newId = uid("s");
      var slots = buildSlots(type, state.data.instellingen.tijden).map(function(sl){
        return {id:sl.slotId, dienst_id:newId, label:sl.label};
      });
      runAction(async function(){
        var r1 = await sbPloeg.from("diensten").insert({
          id:newId, post_id:post, datum:datumVal, type:type, deadline:deadlineIso, notitie:notitie,
          melding_moment:meldingMoment, doelgroep_specialisme:doelgroep.specialisme, doelgroep_aanstelling:doelgroep.aanstelling,
          is_spoed:isSpoed,
          aangemaakt_door:getMemberName(state.currentUserId, state.data), aangemaakt_op:new Date().toISOString()
        });
        if(r1.error) throw r1.error;
        var r2 = await sbPloeg.from("dienst_slots").insert(slots);
        if(r2.error) throw r2.error;
      }, "Dienst opgeslagen");
    } else {
      var id = state.editingShiftId;
      var editingShift = state.data.shifts.filter(function(s){ return s.id===id; })[0];
      var slotUpdates = [];
      if(editingShift){
        editingShift.slots.forEach(function(slot){
          var input = f["slotlabel_" + slot.slotId];
          if(input && input.value && input.value !== slot.label) slotUpdates.push({id:slot.slotId, label:input.value});
        });
      }
      runAction(async function(){
        var r1 = await sbPloeg.from("diensten").update({
          post_id:post, datum:datumVal, deadline:deadlineIso, notitie:notitie, melding_moment:meldingMoment,
          doelgroep_specialisme:doelgroep.specialisme, doelgroep_aanstelling:doelgroep.aanstelling
        }).eq("id", id);
        if(r1.error) throw r1.error;

          var r2 = await sbPloeg.from("dienst_slots").update({label:slotUpdates[i].label}).eq("id", slotUpdates[i].id);
          if(r2.error) throw r2.error;
        }
      }, "Dienst bijgewerkt");
    }
    state.showForm = false; state.editingShiftId = null;
    return false;
  };

      var res = await sbPloeg.from("instellingen").update(patch).eq("id",1);
      if(res.error) throw res.error;
    }, "Standaardtijd opgeslagen");
  };
  App.toggleBeheerOpenFilter = function(checked){ state.beheerAlleenOpen = checked; render(); };

  function downloadFile(filename, content, mime){
    var blob = new Blob([content], {type: mime});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }
  function csvCell(v){
    var s = String(v==null?"":v);
    if(s.indexOf(",")>-1 || s.indexOf('"')>-1 || s.indexOf("\n")>-1){ s = '"' + s.replace(/"/g,'""') + '"'; }
    return s;
  }
  App.exportCsv = function(){
    var data = state.data;
    var rows = [["Dienst ID","Post","Datum","Slot","Doelgroep","Sluit reactietermijn","Naam","Specialismen","Aanstelling","Antwoord","Reactietijdstip","Toegewezen aan","Toewijs methode"]];
    data.shifts.slice().sort(function(a,b){ return parseDateOnly(a.datum)-parseDateOnly(b.datum); }).forEach(function(shift){
      var dg = doelgroepLabel(shift).join(" / ") || "Iedereen";
      shift.slots.forEach(function(slot){
        var assignment = getSlotAssignment(slot.slotId, data);
        var toegewezenAan = assignment ? getMemberName(assignment.lidId, data) : "";
        var methode = assignment ? assignment.methode : "";
        var reacties = data.reacties.filter(function(r){ return r.slotId===slot.slotId; });
        if(!reacties.length){
          rows.push([shift.id, postNaam(shift.post), shift.datum, slot.label, dg, shift.deadline, "", "", "", "", "", toegewezenAan, methode]);
        } else {
          reacties.forEach(function(r){
            var lid = getMember(r.lidId, data);
            rows.push([shift.id, postNaam(shift.post), shift.datum, slot.label, dg, shift.deadline,
              lid?lid.naam:"(onbekend)", lid?(lid.specialismen||[]).join("; "):"", lid?dienstverbandLabel(lid.dienstverband):"",
              ANTWOORD_LABEL[r.antwoord], formatDateTime(r.tijdstip), toegewezenAan, methode]);
          });
        }
      });
    });
    var csv = rows.map(function(row){ return row.map(csvCell).join(","); }).join("\r\n");
    downloadFile("ploegcompleet-reacties-"+toLocalDateStr(new Date())+".csv", "\uFEFF"+csv, "text/csv;charset=utf-8;");
  };
  App.exportJson = function(){
    downloadFile("ploegcompleet-backup-"+toLocalDateStr(new Date())+".json", JSON.stringify(state.data, null, 2), "application/json");
  };

  // ---------- render: shift pieces ----------
  function slotBlock(slot, shift, me, data){
    var assignment = getSlotAssignment(slot.slotId, data);
    if(assignment){
      var lid = getMember(assignment.lidId, data);
      var mine = assignment.lidId === me.id;
      return '<div class="slot"><div class="slot-label">'+escapeHtml(slot.label)+'</div>'
        + '<div class="assigned-banner '+(mine?'mine':'')+'">'+(mine ? '🎉 Toegewezen aan jou!' : 'Toegewezen aan '+escapeHtml(lid?lid.naam:'onbekend'))+'</div></div>';
    }
    var deadlinePassed = remainingMs(shift.deadline) <= 0;
    var mineReactie = data.reacties.filter(function(r){ return r.slotId===slot.slotId && r.lidId===me.id; })[0];
    var counts = countReactions(slot.slotId, data);
    var buttonsOrMsg = deadlinePassed
      ? '<div style="font-size:12px;color:var(--text-muted);">Reactietermijn is verstreken.</div>'
      : '<div class="response-buttons">'
        + '<button class="resp-btn ja '+(mineReactie&&mineReactie.antwoord==="ja"?"selected":"")+'" onclick="App.respond(\''+slot.slotId+'\',\'ja\')">Ja, ik kan</button>'
        + '<button class="resp-btn kan_wel '+(mineReactie&&mineReactie.antwoord==="kan_wel"?"selected":"")+'" onclick="App.respond(\''+slot.slotId+'\',\'kan_wel\')">Kan wel, liever niet</button>'
        + '<button class="resp-btn nee '+(mineReactie&&mineReactie.antwoord==="nee"?"selected":"")+'" onclick="App.respond(\''+slot.slotId+'\',\'nee\')">Nee, ik kan niet</button>'
        + '</div>';
    return '<div class="slot"><div class="slot-label">'+escapeHtml(slot.label)+'</div>'
      + buttonsOrMsg
      + '<div class="counts-line">'+counts.ja+' ja &middot; '+counts.kan_wel+' kan wel &middot; '+counts.nee+' nee</div>'
      + '</div>';
  }

  function adminPanel(shift, data){
    var rows = shift.slots.map(function(slot){
      var assignment = getSlotAssignment(slot.slotId, data);
      var ranked = autoSuggestForSlot(slot.slotId, data);
      var body = "";
      if(assignment){
        body += '<div class="reactie-row"><span>Toegewezen: <strong>'+escapeHtml(getMemberName(assignment.lidId,data))+'</strong></span><span class="reactie-meta">'+assignment.methode+'</span></div>';
      }
      if(ranked.length){
        body += ranked.map(function(r, i){
          return '<div class="reactie-row">'
            + '<span>'+(i===0?'<span class="suggest-star">★</span>':'')+escapeHtml(r.naam)+' – '+ANTWOORD_LABEL[r.antwoord]+' <span class="reactie-meta">('+r.count+'x dit jaar)</span></span>'
            + '<button class="small-btn" onclick="App.assignSlot(\''+slot.slotId+'\',\''+r.lidId+'\',\'handmatig\')">Wijs toe</button>'
            + '</div>';
        }).join("");
      } else if(!assignment){
        body += '<div class="reactie-row"><span class="reactie-meta">Nog geen reacties.</span></div>';
      }
      var autoBtn = (!assignment && ranked.length) ? '<button class="small-btn primary" style="margin-top:8px;" onclick="App.autoAssign(\''+slot.slotId+'\')">★ Automatisch toewijzen (minste diensten)</button>' : '';
      return '<div style="margin-bottom:10px;"><div style="font-size:12px;color:var(--text-muted);margin-bottom:4px;">'+escapeHtml(slot.label)+'</div>'+body+autoBtn+'</div>';
    }).join("");
    return '<div class="admin-panel"><h4>Reacties &amp; toewijzing</h4>'+rows+'</div>';

  function shiftCard(shift, me, kanBeheren, data){
    var urgency = urgencyOf(shift.datum);
    var frac = elapsedFraction(shift);
    var deadlinePassed = remainingMs(shift.deadline) <= 0;
    var slotsHtml = shift.slots.map(function(slot){ return slotBlock(slot, shift, me, data); }).join("");
    var tools = "";
    if(kanBeheren){
      tools += '<button class="expand-btn" onclick="App.toggleExpand(\''+shift.id+'\')">'+(state.expandedShiftId===shift.id?'Verberg reacties ↑':'Bekijk reacties ↓')+'</button>';
      if(hasOpenSlot(shift, data)){
        tools += '<a class="wa-link" target="_blank" rel="noopener" href="'+waShareUrl(shift, data)+'">Delen via WhatsApp</a>';
      }
    }
    var panel = (kanBeheren && state.expandedShiftId===shift.id) ? adminPanel(shift, data) : "";
    var dgTags = doelgroepLabel(shift).map(function(t){ return '<span class="doelgroep-tag">'+escapeHtml(t)+'</span>'; }).join("");
    return '<div class="card">'
      + '<div class="card-top">'
      + '<div class="tag-row">'
      + '<span class="post-tag '+postClass(shift.post)+'">'+escapeHtml(postNaam(shift.post))+'</span>'
      + (urgency==="vandaag" ? '<span class="urgent-badge">Spoed &middot; vandaag</span>' : '')
      + (shift.isSpoed ? '<span class="urgent-badge" title="Eerste ja krijgt de dienst direct">⚡ Eerste ja = toegewezen</span>' : '')
      + dgTags
      + '</div>'
      + '</div>'
      + '<div class="date-big" style="margin-top:6px;">'+formatDateShort(shift.datum)+'</div>'
      + (shift.notitie ? '<div class="notitie">'+escapeHtml(shift.notitie)+'</div>' : '')
      + slotsHtml
      + '<div class="deadline-row"><span>Reageren kan tot '+formatDateTime(shift.deadline)+'</span><span>'+formatRemaining(shift.deadline)+'</span></div>'
      + '<div class="deadline-track"><div class="deadline-elapsed" style="width:'+(frac*100)+'%;"></div>'+(deadlinePassed?'':'<div class="deadline-remaining" style="width:'+((1-frac)*100)+'%;"></div>')+'</div>'
      + (tools ? '<div class="card-tools">'+tools+'</div>' : '')
      + panel
      + '</div>';
  }

  function renderDienstenView(me, kanBeheren, data){
    var relevant = function(s){ return matchesDoelgroep(me, s); };
    var open = openShifts(data).filter(relevant).slice().sort(function(a,b){ return parseDateOnly(a.datum)-parseDateOnly(b.datum); });
    var groups = {vandaag:[], komende4:[], verderop:[]};
    open.forEach(function(s){ groups[urgencyOf(s.datum)].push(s); });

    var html = '<div class="info-line">Reageer met <strong>Ja</strong>, <strong>Kan wel (liever niet)</strong>, of <strong>Nee</strong>. Bij meerdere ja’s krijgt voorlopig degene die dit jaar de minste diensten heeft gedraaid voorrang – definitieve regels volgen nog. Je ziet hier alleen diensten die voor jouw specialisme/aanstelling bedoeld zijn.</div>';

    if(!open.length){
      html += '<div class="empty">Geen openstaande diensten voor jou op dit moment. Alles is ingevuld! 🎉</div>';
    } else {
      if(groups.vandaag.length){ html += '<div class="eyebrow">Spoed &middot; vandaag</div>' + groups.vandaag.map(function(s){ return shiftCard(s, me, kanBeheren, data); }).join(""); }
      if(groups.komende4.length){ html += '<div class="eyebrow">Komende 4 dagen</div>' + groups.komende4.map(function(s){ return shiftCard(s, me, kanBeheren, data); }).join(""); }
      if(groups.verderop.length){ html += '<div class="eyebrow">Verder vooruit</div>' + groups.verderop.map(function(s){ return shiftCard(s, me, kanBeheren, data); }).join(""); }
    }

    var filled = filledShifts(data).filter(relevant).slice().sort(function(a,b){ return parseDateOnly(b.datum)-parseDateOnly(a.datum); }).slice(0,10);
    if(filled.length){
      html += '<details class="filled-section"><summary>Toegewezen diensten ('+filled.length+')</summary>' + filled.map(function(s){ return shiftCard(s, me, kanBeheren, data); }).join("") + '</details>';
    }
    return html;
  }

      + '<div class="field"><label>Naam</label><input type="text" name="naam" required /></div>'
      + '<div class="field"><label>App-rechten</label><select name="rol">'
        + ROLE_ORDER.map(function(r){ return '<option value="'+r+'" '+(r==="personeel"?"selected":"")+'>'+roleLabel(r)+'</option>'; }).join("")
      + '</select></div>'
      + '</div><button type="submit" class="btn btn-primary">Toevoegen</button>'
      + '<div style="font-size:12px;color:var(--text-muted);margin-top:8px;">Standaard pincode: <strong>1234</strong>.</div>'
      + '</form></div>';

    html += '<div class="eyebrow">Personeel ('+members.length+')</div>';
    html += '<div class="info-line">"App-rechten" bepaalt wat iemand in PloegCompleet mag doen – dat is iets anders dan een functie/specialisme uit Dagstaat, ook als de naam (bv. Bevelvoerder) toevallig hetzelfde is.</div>';
    html += '<input type="text" placeholder="Zoek personeel…" oninput="App.filterPersoneelList(this.value)" style="margin-bottom:10px;" />';
    var specialismenOpties = data.specialismenOpties || ["Bevelvoerder","Manschap","Duiker"];
    members.forEach(function(m){
      var count = computeShiftCounts(m.id, data);
      var metaBits = [];
      if(m.post) metaBits.push(postNaam(m.post));
      if(m.ploeg) metaBits.push(m.ploeg.replace(/^post\d+-/,""));
      if(!m.isExtra && m.specialismen && m.specialismen.length) metaBits.push(m.specialismen.join(", "));
      metaBits.push(dienstverbandLabel(m.dienstverband));
      if(m.email) metaBits.push(m.email);
      var specialismenBox = m.isExtra ?
        '<div class="specialismen-box" style="margin-top:8px;">'
        + '<span class="inline-field-label">Specialismen (voor doelgroep-testen)</span>'
        + specialismenOpties.map(function(o){
            var checked = m.specialismen.indexOf(o)>-1;
            var cbid = "sp_"+m.id+"_"+o.replace(/[^a-zA-Z0-9]/g,"");
            return '<label style="display:inline-flex;align-items:center;gap:4px;margin:2px 8px 2px 0;text-transform:none;font-size:12px;"><input type="checkbox" id="'+cbid+'" value="'+escapeHtml(o)+'" '+(checked?"checked":"")+' onchange="App.updateMemberSpecialismen(\''+m.id+'\', this)" style="width:auto;" />'+escapeHtml(o)+'</label>';
          }).join("")
        + '</div>' : '';
      html += '<div class="list-item personeel-item" data-naam="'+escapeHtml(m.naam)+'"><div class="list-item-top">'
        + '<span>'+escapeHtml(m.naam)+' <span class="reactie-meta">('+count+'x dit jaar)</span> '+(m.isExtra?'<span class="role-badge extra">Extra account</span>':'')+'</span>'
        + '<select class="mini-select" onchange="App.updateMemberRole(\''+m.id+'\',this.value)">'
          + ROLE_ORDER.map(function(r){ return '<option value="'+r+'" '+(m.rol===r?'selected':'')+'>'+roleLabel(r)+'</option>'; }).join("")
        + '</select>'
        + '</div>'
        + '<div class="meta-line">'+metaBits.map(escapeHtml).join(' &middot; ')+(m.isExtra?' &middot; (niet in Dagstaat)':'')+'</div>'
        + '<div class="field-row" style="margin-top:8px;">'
        + '<div><span class="inline-field-label">06-nummer</span><input class="phone-input" type="tel" placeholder="06…" value="'+escapeHtml(m.telefoon||"")+'" onchange="App.updateMemberPhone(\''+m.id+'\',this.value)" /></div>'
        + '<div><span class="inline-field-label">Pincode</span><input class="pin-input" type="text" inputmode="numeric" maxlength="6" placeholder="••••" onchange="App.updateMemberPin(\''+m.id+'\',this.value)" /></div>'
        + '<div><span class="inline-field-label">Correctie telling</span><input class="pin-input" type="number" step="1" value="'+m.correctie+'" onchange="App.updateMemberCorrectie(\''+m.id+'\',this.value)" title="Aantal diensten dat handmatig bij de telling van dit jaar wordt opgeteld (kan negatief)." /></div>'
        + '</div>'
        + specialismenBox
        + (m.isExtra ? (
            state.confirmDeleteMemberId===m.id
              ? '<div style="margin-top:8px;font-size:12px;">Zeker weten? <button class="small-btn primary" onclick="App.confirmDeleteMember(\''+m.id+'\')">Ja, verwijderen</button> <button class="small-btn" onclick="App.cancelDeleteMember()">Annuleren</button></div>'
              : '<div class="btn-row"><button class="small-btn" style="color:#FF8A80;" onclick="App.askDeleteMember(\''+m.id+'\')">Verwijderen</button></div>'
          ) : '')
        + '</div>';
    });
    return html;
  }

  function renderInstellingenView(data){
    var wa = (data.instellingen && data.instellingen.whatsappNummer) || "";
    var tijden = (data.instellingen && data.instellingen.tijden) || defaultTijden();
    var html = '<div class="card">'
      + '<h3 style="margin-top:0;font-family:var(--font-display);text-transform:uppercase;">Standaardtijden</h3>'
      + '<div style="font-size:12px;color:var(--text-muted);margin-bottom:10px;">Gebruikt bij het aanmaken van nieuwe diensten. Tijden van een bestaande dienst pas je aan via Beheer diensten &rarr; Bewerken.</div>'
      + '<div class="field-row">'
      + '<div class="field"><label>Ochtend-wisseltijd</label><input type="time" value="'+escapeHtml(tijden.ochtend)+'" onchange="App.updateStandaardtijden(\'ochtend\',this.value)" /></div>'
      + '<div class="field"><label>Avond-wisseltijd</label><input type="time" value="'+escapeHtml(tijden.avond)+'" onchange="App.updateStandaardtijden(\'avond\',this.value)" /></div>'
      + '</div>'
      + '<div style="font-size:12px;color:var(--text-muted);">Hele dienst: '+escapeHtml(tijden.ochtend)+'–'+escapeHtml(tijden.ochtend)+' &middot; Dag: '+escapeHtml(tijden.ochtend)+'–'+escapeHtml(tijden.avond)+' &middot; Avond/Nacht: '+escapeHtml(tijden.avond)+'–'+escapeHtml(tijden.ochtend)+'</div>'
      + '</div>';
    html += '<div class="card">'
      + '<h3 style="margin-top:0;font-family:var(--font-display);text-transform:uppercase;">WhatsApp</h3>'
      + '<div class="field"><label>WhatsApp-nummer voor "Delen via WhatsApp"</label>'
      + '<input type="tel" value="'+escapeHtml(wa)+'" placeholder="06… (internationaal, bv. 316xxxxxxxx)" onchange="App.updateWhatsappNummer(this.value)" /></div>'
      + '<div style="font-size:12px;color:var(--text-muted);">Alle "Delen via WhatsApp"-knoppen openen voorlopig een bericht naar dit ene nummer. Laat leeg om weer een contactkiezer te tonen.</div>'
      + '<div class="field" style="margin-top:14px;"><label>Berichttekst</label>'
      + '<textarea id="berichtSjabloonInput" oninput="document.getElementById(\'berichtVoorbeeld\').textContent = App.previewBericht(this.value);" onchange="App.updateBerichtSjabloon(this.value)">'+escapeHtml(data.instellingen.berichtSjabloon)+'</textarea></div>'
      + '<div style="font-size:11px;color:var(--text-muted);margin-bottom:8px;">Plaatshouders: <code>{post}</code> <code>{datum}</code> <code>{deadline}</code> <code>{doelgroep}</code>. Dit sjabloon wordt straks ook gebruikt voor pushmeldingen en e-mail, zodra die er zijn.</div>'
      + '<div class="preview-line" id="berichtVoorbeeld">'+escapeHtml(App.previewBericht(data.instellingen.berichtSjabloon))+'</div>'
      + '</div>';
    html += '<div class="card">'
      + '<h3 style="margin-top:0;font-family:var(--font-display);text-transform:uppercase;">Dashboard-koppeling</h3>'
      + '<div style="font-size:12px;color:var(--text-muted);">De externe dashboard-site kan open diensten (post, datum, wel/geen duiker, notitie) ophalen via:</div>'
      + '<div style="font-family:var(--font-mono);font-size:11px;background:var(--surface-2);border:1px solid var(--border);border-radius:6px;padding:8px;margin-top:6px;word-break:break-all;">'+escapeHtml(PLOEG_URL)+'/rest/v1/dashboard_open_diensten</div>'
      + '</div>';
    html += '<div class="info-line">Overzicht van rollen en rechten binnen PloegCompleet.</div>';
    ROLE_ORDER.forEach(function(r){
      var info = ROLE_INFO[r];
      var count = data.members.filter(function(m){ return m.rol===r; }).length;
      html += '<div class="card"><div class="card-top">'
        + '<span class="role-badge '+(r!=="personeel"?"admin":"")+'" style="font-size:12px;padding:4px 9px;">'+info.label+'</span>'
        + '<span class="reactie-meta">'+count+' perso'+'on'+(count===1?'':'en')+'</span>'
        + '</div><div style="margin-top:8px;font-size:13px;color:var(--text-muted);">'+info.omschrijving+'</div></div>';
    });
    return html;
  }

  function renderMeldingenDropdown(data){
    var items = data.meldingen.slice().sort(function(a,b){ return new Date(b.tijdstip)-new Date(a.tijdstip); }).slice(0,20);
    var body = items.length ? items.map(function(m){
      return '<div class="melding-item">'+escapeHtml(m.tekst)+'<div class="melding-time">'+formatDateTime(m.tijdstip)+'</div></div>';
    }).join("") : '<div class="melding-item">Geen meldingen.</div>';
    return '<div class="melding-dropdown">'+body+'</div>';
  }

  function renderMain(){
    var data = state.data;
    var me = getMember(state.currentUserId, data);
    if(!me){ state.currentUserId = null; return renderLogin(); }
    var kanBeheren = kanDienstenBeheren(me.rol);
    var kanPersoneel = kanPersoneelBeheren(me.rol);
    var kanInstellingen = kanInstellingenZien(me.rol);
    var unread = data.meldingen.filter(function(m){ return !m.gelezen; }).length;

    var header = '<div class="header">'
      + '<div class="header-row">'
      + brandBlock()
      + '<div class="header-actions">'
      + '<button class="icon-btn" title="Vernieuwen" onclick="App.refreshData()">↻</button>'
      + (kanBeheren ? '<button class="icon-btn" title="Meldingen" onclick="App.toggleBell()">🔔'+(unread?'<span class="badge-dot">'+unread+'</span>':'')+'</button>' : '')
      + '<button class="user-chip" onclick="App.switchUser()">'+escapeHtml(me.naam)+' <span class="role">&middot; '+roleLabel(me.rol)+'</span> &#8646;</button>'
      + (state.bellOpen ? renderMeldingenDropdown(data) : '')
      + '</div></div>'
      + '<div class="chevron-divider"></div>'
      + '<div class="tabs">'
      + '<button class="tab '+(state.view==="diensten"?"active":"")+'" onclick="App.setView(\'diensten\')">Diensten</button>'
      + '<button class="tab '+(state.view==="mijn"?"active":"")+'" onclick="App.setView(\'mijn\')">Mijn diensten</button>'
      + (kanBeheren ? '<button class="tab '+(state.view==="beheer-diensten"?"active":"")+'" onclick="App.setView(\'beheer-diensten\')">Beheer diensten</button>' : '')
      + (kanPersoneel ? '<button class="tab '+(state.view==="personeel"?"active":"")+'" onclick="App.setView(\'personeel\')">Personeel</button>' : '')
      + (kanInstellingen ? '<button class="tab '+(state.view==="instellingen"?"active":"")+'" onclick="App.setView(\'instellingen\')">Instellingen</button>' : '')
      + '</div></div>';

    var body;
    if(state.view==="mijn") body = renderMijnView(me, data);
    else if(state.view==="beheer-diensten" && kanBeheren) body = renderBeheerDienstenView(data);
    else if(state.view==="personeel" && kanPersoneel) body = renderPersoneelView(data);
    else if(state.view==="instellingen" && kanInstellingen) body = renderInstellingenView(data);
    else body = renderDienstenView(me, kanBeheren, data);

    return header + '<div class="content">' + body + '</div>' + (state.toast ? '<div class="toast">'+escapeHtml(state.toast)+'</div>' : '');
  }

  function render(){
    var root = document.getElementById("app");
    if(state.loading){ root.innerHTML = renderLoading(); return; }
    if(state.loadError){ root.innerHTML = renderLoadError(); return; }
    if(!state.currentUserId){
      root.innerHTML = state.pendingUserId ? renderPinEntry() : renderLogin();
      return;
    }
    root.innerHTML = renderMain();
  }

  setInterval(function(){
    if(!state.loading && !state.loadError && state.currentUserId && !state.showForm){ render(); }
  }, 60000);

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* pushmeldingen zijn een bonus, geen vereiste */ });
  }

  loadInitial();
})();
</script>
</body>
</html>
